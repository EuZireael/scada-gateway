# ============================================================================
# ОПЦИОНАЛЬНАЯ наблюдаемость: Prometheus + Grafana поверх основного стека.
# НЕ поднимается сам по себе (это не docker-compose.override.yml) — включается явно:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#   (или ./up.sh, а затем эта команда — сервисы доподнимутся в ту же сеть scada)
#
# Порты на хост:
#   3000 — Grafana    (анонимный Viewer; admin/admin для правок; дашборд «SCADA Gateway»)
#   9090 — Prometheus (скрейпит gateway:8888/actuator/prometheus)
#
# SELinux (Fedora/podman): bind-mount'ы конфигов идут с :Z (перелейбл под контейнер).
# ============================================================================
name: scada

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: scada-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    ports:
      - "9090:9090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [scada]

  grafana:
    image: grafana/grafana:latest
    container_name: scada-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Анонимный доступ на чтение — открыть дашборд без логина (демо-удобство).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [scada]
