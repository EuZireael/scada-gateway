# ============================================================================
# Профили нагрузочных тестов SCADA. Выбираешь профиль → run.py его прогоняет:
#     python3 run.py smoke
#     python3 run.py stress_opcua
#
# Что тестируем (локальный стек: sim → gateway → Kafka; монитора здесь нет):
#   • achieved rate — реально ли шлюз выдаёт ожидаемый поток tags/poll в Kafka,
#     или «не успевает» (это и есть колено под нагрузкой);
#   • JVM шлюза (heap/GC/CPU/потоки) — особенно на soak (утечки);
#   • восстановление после обрыва (wave/chaos).
#
# Две ручки нагрузки: число тегов (tags/ladder) и частота (poll_ms).
# Firehose: поток ≈ tags / (poll_ms/1000) сообщений/с.
# ============================================================================

defaults:
  persist_telemetry: false   # изолируем throughput Kafka от Postgres (иначе меряем БД)
  metrics_interval_s: 5      # как часто снимать метрики в CSV
  bool_ratio: 0.3            # доля BOOLEAN тегов (реализм; на throughput не влияет)

profiles:

  # Дымовой: доказать, что согласованная пара конфигов реально грузит шлюз.
  smoke:
    protocol: opcua
    tags: 1000
    poll_ms: 1000
    duration_s: 120

  # СТРЕСС OPC — лестница размеров до колена. OPC читается ОДНИМ батчем read(),
  # поэтому тянет выше Modbus. Ищем, где achieved rate отваливается от ожидаемого.
  stress_opcua:
    protocol: opcua
    poll_ms: 200
    ladder: [2000, 5000, 20000, 50000, 100000]
    step_duration_s: 180

  # СТРЕСС Modbus — узкое место: 1877+ тегов читаются ПОСЛЕДОВАТЕЛЬНО, по одному
  # round-trip, в один поток. Стена в тысячах тегов (цикл не уложится в интервал).
  stress_modbus:
    protocol: modbus
    poll_ms: 1000
    ladder: [500, 1000, 2000, 4000, 8000]
    step_duration_s: 180

  # ВОЛНООБРАЗНЫЙ (спайк): симулятор периодически «пропадает» (docker pause) и
  # возвращается. Проверяет восстановление: реконнект, слив очереди, тайминг цикла.
  wave:
    protocol: mix
    mix_opc: 0.7
    tags: 20000
    poll_ms: 500
    duration_s: 1800
    wave: {on_s: 60, off_s: 30}   # 60с симулятор доступен, 30с на паузе, повторять

  # ДЛИТЕЛЬНАЯ НАГРУЗКА (soak): ровно и долго — ловим утечки (heap не возвращается
  # после GC, рост сокетов/потоков). chaos бьёт по реконнекту под нагрузкой.
  soak:
    protocol: mix
    mix_opc: 0.7
    tags: 10000
    poll_ms: 500
    duration_s: 14400              # 4 часа
    chaos:
      - {at_s: 3600, action: kafka_pause, secs: 30}   # обрыв брокера на 30с
      - {at_s: 7200, action: sim_restart}             # рестарт симулятора
