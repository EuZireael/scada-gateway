# ============================================================================
# Dependabot — автоматические PR на обновление зависимостей.
#   Проверяет экосистемы проекта раз в неделю и открывает PR, которые проходят
#   через тот же CI/CD (ci.yml), поэтому «красное» обновление не влить.
# Замечание: Dependabot запускается на КАНОНИЧЕСКОМ репозитории (savushkin-dev)
#   и только если включён в его настройках; на форке он неактивен.
# ============================================================================
version: 2
updates:
  # ---- Java: зависимости шлюза (pom.xml) ----
  - package-ecosystem: "maven"
    directory: "/SCADA-gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "java"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Мажоры, требующие ручной миграции (не через бота):
      # Spring Boot 4 = Spring 7 / Jakarta — крупная миграция.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        versions: [">=4"]
      # j2mod 3.x — несовместимый API Modbus-клиента шлюза.
      - dependency-name: "com.ghgande:j2mod"
        versions: [">=3"]

  # ---- Python: зависимости симулятора (requirements.txt) ----
  - package-ecosystem: "pip"
    directory: "/plc-simulator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # pymodbus 3.8 переименовал датастор, а 3.15 полностью его переписал —
      # ломает core/modbus_server.py. Держимся на 3.7.x (патчи разрешены),
      # мажор 3.8+ мигрировать только вручную. См. requirements.txt.
      - dependency-name: "pymodbus"
        versions: [">=3.8"]
      # asyncua 2.x — мажор OPC UA сервера/клиента, ломает симулятор (нужна миграция).
      - dependency-name: "asyncua"
        versions: [">=2"]

  # ---- GitHub Actions: версии экшенов в workflow ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

  # ---- Docker: базовые образы Dockerfile'ов ----
  - package-ecosystem: "docker"
    directory: "/SCADA-gateway"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Рантайм-JDK держим на 21 LTS в лад со сборкой (java.version=21).
      - dependency-name: "eclipse-temurin"
        versions: [">=22"]
  - package-ecosystem: "docker"
    directory: "/plc-simulator"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Python 3.12+ ломает asyncua (баг issubclass) — держим 3.11 (см. Dockerfile).
      - dependency-name: "python"
        versions: [">=3.12"]
