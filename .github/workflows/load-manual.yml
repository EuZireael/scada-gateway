# ============================================================================
# Нагрузочный тест ПО КНОПКЕ (разведка «колена»).
#   Ручной запуск с выбором профиля. В отличие от гейта — БЕЗ жёсткого pass/fail:
#   гоняет ступени, кладёт CSV+сводку артефактом, дальше смотришь глазами.
#
#   ВАЖНО про числа: раннер GitHub — общие 2–4 ядра и «шумный сосед», поэтому
#   абсолютный msg/s тут ОРИЕНТИРОВОЧНЫЙ, а не замер ёмкости прода. Для настоящего
#   бенчмарка нужен self-hosted раннер размером с прод / выделенное железо.
#
#   soak (4 ч) сюда не вынесен намеренно: не влезает в разумный лимит job и жрёт
#   минуты — его место на self-hosted-раннере.
# ============================================================================
name: Load test (manual)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль нагрузки'
        type: choice
        options:
          - smoke
          - stress_opcua
          - stress_modbus
        default: smoke

concurrency:
  group: loadtest-manual
  cancel-in-progress: false

jobs:
  loadtest:
    name: Load test (${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60          # stress-лестницы длинные (5 ступеней × 180с + рестарты)
    steps:
      - uses: actions/checkout@v7

      # jar собираем на хосте: Dockerfile шлюза копирует готовый target/*.jar.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build gateway jar
        working-directory: SCADA-gateway
        run: ./mvnw -B -DskipTests package

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install harness deps
        run: pip install pyyaml

      # Без --min-rate: тест справочный (разведка), сборку не роняет.
      - name: Run load test
        run: python3 loadtest/run.py ${{ github.event.inputs.profile }} --build

      - name: Upload metrics CSV
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-${{ github.event.inputs.profile }}-metrics
          path: loadtest/metrics/*.csv
          if-no-files-found: ignore
