# ============================================================================
# CI/CD — GitHub Actions.
# Запускается на push в main, на КАЖДЫЙ pull request и на пуш релизного тега vX.Y.Z.
#   CI (проверка): собирает шлюз + гоняет юнит-тесты, проверяет синтаксис Python.
#   CD (доставка): собирает docker-образ шлюза и публикует в GHCR —
#     push в main → :latest (+ :<sha>);  тег vX.Y.Z → :vX.Y.Z (+ :<sha>).
# Результат (зелёная/красная галочка) виден прямо в PR — сломанный код не влить.
# ============================================================================
name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]        # релизный тег vX.Y.Z → версионный образ
  pull_request:

jobs:
  # -------------------- Шлюз: сборка + юнит-тесты (Java) --------------------
  gateway:
    name: Gateway build & test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SCADA-gateway   # здесь лежат pom.xml и mvnw
    steps:
      - uses: actions/checkout@v7

      # JDK 21 — совпадает с java.version в pom и с рантаймом (temurin 21-jre).
      # cache: maven — кэширует ~/.m2, чтобы зависимости не качались каждый раз.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -B (batch) — без интерактива и прогресс-баров, чистый лог для CI.
      # verify = compile + test (+ package): здесь прогоняются все юнит-тесты.
      - name: Build and test
        run: ./mvnw -B verify

      # Отчёты surefire — прикладываем к запуску, чтобы при падении было видно,
      # какой тест упал, не заходя в раннер (доступно во вкладке Actions).
      - name: Upload test reports
        if: always()   # даже если сборка упала — отчёт всё равно нужен
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: SCADA-gateway/target/surefire-reports/
          if-no-files-found: ignore

  # ------------------ Симулятор/стенд: проверка синтаксиса ------------------
  # Быстрый гейт: все .py компилируются (нет опечаток/битого кода). Логику
  # проверяет отдельная джоба python-tests (pytest) ниже.
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'   # совпадает с образом симулятора (python:3.11-slim)

      - name: Byte-compile all Python
        run: |
          find plc-simulator loadtest tools -name '*.py' -print0 \
            | xargs -0 python -m py_compile
          echo "OK: все .py компилируются"

  # ------------------ Python-часть: юнит-тесты (pytest) --------------------
  # Логика симулятора и генератора нагрузочных конфигов: упаковка Modbus-
  # регистров (Tag.get_modbus_registers), формат значений ptusa (fmt_value),
  # стыковка адресов gateway↔sim в gen_config. Тесты лежат в tests/.
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'   # совпадает с образом симулятора (python:3.11-slim)
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # requirements-dev.txt тянет рантайм-зависимости симулятора (нужны для
      # импорта core.tag / sim_records / gen_config) плюс сам pytest.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  # ---------------- CD: сборка и публикация docker-образа шлюза -------------
  # «D» из CI/CD. На PR — только СОБИРАЕТ образ (проверка, что Dockerfile рабочий).
  # На push в main / тег vX.Y.Z — ПУБЛИКУЕТ в GHCR: main → :latest, тег → :версия
  # (оба + :<sha>). needs: gateway — образ собираем только если юнит-тесты прошли.
  docker:
    name: Build & publish image (GHCR)
    needs: gateway
    # Только на КАНОНИЧЕСКОМ репозитории. На форке push в main-зеркало (синк после
    # мёржа) публиковать в ghcr.io/<форк> нечего и незачем — без этого гарда job
    # валится на docker push и сыплет уведомлениями «CI/CD failed for main».
    # На pull_request github.repository = БАЗОВЫЙ репо (savushkin-dev) → job идёт
    # (валидация сборки образа); на форк-пуше — пропускается целиком.
    if: github.repository == 'savushkin-dev/scada-gateway'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # право публиковать пакет в GHCR через GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Dockerfile копирует ГОТОВЫЙ jar из target/, поэтому сначала собираем jar.
      # Тесты уже прошли в job gateway → здесь -DskipTests (быстрее, без дублей).
      - name: Build jar
        working-directory: SCADA-gateway
        run: ./mvnw -B -DskipTests package

      # Логинимся в GHCR только на push в main (у PR из форка токен read-only —
      # публиковать нечем и незачем, поэтому там образ лишь собирается).
      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Какими тегами метить образ — зависит от того, ЧТО пушим:
      #   main       → :latest (+ :<sha>)   — «последняя сборка main» (dev);
      #   тег vX.Y.Z → :vX.Y.Z (+ :<sha>)   — замороженная версия для деплоя;
      #   PR         → :ci-<sha>            — только валидация сборки, не публикуется.
      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          case "${{ github.ref }}" in
            refs/heads/main) TAGS="$IMAGE:latest $IMAGE:${{ github.sha }}" ;;
            refs/tags/v*)    TAGS="$IMAGE:${{ github.ref_name }} $IMAGE:${{ github.sha }}" ;;
            *)               TAGS="$IMAGE:ci-${{ github.sha }}" ;;
          esac
          ARGS=""; for t in $TAGS; do ARGS="$ARGS -t $t"; done
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      # Контекст сборки — SCADA-gateway (Dockerfile там же).
      - name: Build image
        run: docker build ${{ steps.meta.outputs.args }} SCADA-gateway

      # Публикуем ОБА тега только на push в main; на PR этот шаг пропускается.
      - name: Push image
        if: github.event_name == 'push'
        run: docker push -a ghcr.io/${{ github.repository }}
