server:
  port: 8888

# yaml-language-server: $schema=

spring:
  # Контроллеры и теги вынесены в отдельный файл (был раздут до 915 КБ).
  config:
    import: classpath:controllers.yaml
  application:
    name: scada-gateway

  # Пул планировщика @Scheduled. Дефолт Spring Boot = 1 поток: один зависший
  # супервизор заморозил бы ВСЕ периодические задачи (супервизор + сводка здоровья).
  # 3 потока — задачи идут независимо. (См. gateway-opcua-write-issue.md, фикс №2.)
  task:
    scheduling:
      pool:
        size: 3
  
  datasource:
    url: jdbc:postgresql://localhost:5433/scada_db
    username: scada_user
    password: scada_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      # Схемой теперь владеет Flyway; Hibernate только СВЕРЯЕТ (validate), не меняет.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Flyway владеет схемой (миграции db/migration/Vn__*.sql). baseline-on-migrate: на
  # СУЩЕСТВУЮЩЕЙ БД (создана Hibernate) ставит baseline V1 и НЕ гоняет V1 повторно;
  # на ПУСТОЙ БД гоняет V1 с нуля. Дальше схему меняем только новыми Vn-миграциями.
  flyway:
    baseline-on-migrate: true
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: 
          telemetry: com.scada.gateway.kafka.dto.TelemetryMessage,
          alarm: com.scada.gateway.kafka.dto.AlarmMessage,
          event: com.scada.gateway.kafka.dto.EventMessage
        # Идемпотентный продюсер: без него retries>0 при повторной отправке может
        # ПЕРЕСТАВИТЬ сообщения внутри партиции. Тег ключуется по имени (всё в одну
        # партицию) → старое значение способно лечь после нового = моргание
        # устаревшей телеметрии на мониторе. enable.idempotence: брокер дедуплицирует
        # по seq и держит порядок в партиции.
        enable.idempotence: true
        # Идемпотентность требует acks=all. В стенде репликация=1, поэтому acks=all
        # ждёт только лидера — по задержке это ровно как acks=1, но уже с гарантией
        # порядка. На реальном кластере то же станет и гарантией долговечности.
        acks: all
        # <=5 безопасно и упорядоченно при включённой идемпотентности.
        max.in.flight.requests.per.connection: 5
        retries: 10
        # Обрыв брокера НЕ должен морозить поток опроса ПЛК: send() не виснет дольше
        # 5с (ожидание метадаты / переполнение буфера) — падает быстро, следующий
        # цикл пришлёт свежее значение. Иначе поток чтения встаёт на max.block.ms=60с.
        max.block.ms: 5000
        # ВАЖНО: под properties идут СЫРЫЕ имена клиента Kafka (с точками). Было
        # compression-type/batch-size (Spring-имена) — клиент их не знал и игнорировал,
        # snappy по факту НЕ включалась. Правильные ключи:
        compression.type: snappy
        batch.size: 32768
        linger.ms: 5
    consumer:
      group-id: scada-gateway-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.scada.gateway.kafka.dto
    admin:
      auto-create: false
  
  docker:
    compose:
      enabled: false

modbus:
  host: 127.0.0.1
  port: 5020
  enabled: true

kafka:
  enabled: true
  # В проводе: телеметрия + события + алармы. События также пишутся в БД шлюза
  # (event_log) как журнал; в Kafka они идут для монитора (топики events/alarms).
  publish:
    events: true
    alarms: true
  # Телеметрия идёт в топик, который СЛУШАЕТ монитор (runtime: KafkaProperties.tagsTopic
  # = scada.tags, TagKafkaConsumer.subscribe). Имя топика — единая точка стыка шлюз↔монитор.
  topics:
    telemetry: scada.tags
    alarms: scada-alarms
    events: scada-events
    commands: scada-commands
    command-results: scada-command-results

# ============================================================================
# Флаги горячего пути шлюза. Меняются без пересборки (перезапуск шлюза).
# ============================================================================
gateway:
  alarms:
    # Проверка порогов/алармов в шлюзе. По умолчанию ВЫКЛ — алармы считает Monitor.
    # true → шлюз снова генерит алармы (edge-триггер p1/p99) в топик scada-alarms.
    enabled: false
  # Писать каждую точку в локальную БД шлюза (таблица telemetry). В Kafka значения
  # идут в любом случае; это лишь локальная история. false → БД шлюза не пишется.
  persist-telemetry: true
  # A3: слать ли кадр телеметрии при обрыве (value=null, quality=BAD). По умолчанию
  # ВЫКЛ: без правок монитора (C4: onChange не дёргается на не-GOOD) и фронта
  # (B2: рендер «нет данных») null «уверенно закроет клапан». Включать ТОЛЬКО когда
  # обе стороны готовы — тогда оператор увидит потерю связи, а не замерший тег.
  send-bad-frames: false
  # Таймаут блокирующих OPC UA-вызовов (discovery / connect / read / write / disconnect).
  # Без него зависший handshake/чтение вешает поток супервизора/опроса НАВСЕГДА. 5 c →
  # быстро падаем и ретраим на следующем цикле супервизора; неудача видна в event_log.
  opcua-op-timeout-ms: 5000
  # Таймаут Modbus (j2mod) на connect И на чтение транзакции. j2mod имеет неявный дефолт
  # 3000 мс — задаём явно, чтобы не зависеть от дефолта библиотеки и иметь возможность крутить.
  modbus-op-timeout-ms: 3000

logging:
  level:
    com.scada.gateway: INFO
    org.eclipse.milo: WARN
    # Внутренний netty-хендлер Milo сыплет ERROR+стектрейс «Connection reset» при
    # обрыве OPC UA — это уже чисто фиксирует markControllerDown, поэтому глушим.
    org.eclipse.milo.opcua.stack.client.transport.uasc.UascClientMessageHandler: "OFF"
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{0} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
