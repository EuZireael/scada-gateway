# Провайдер дашбордов: Grafana подхватывает JSON из /var/lib/grafana/dashboards
# (примонтирован из observability/grafana/dashboards).
apiVersion: 1
providers:
  - name: SCADA
    orgId: 1
    folder: SCADA
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
